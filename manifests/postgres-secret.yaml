# Secret contenant les identifiants sensibles de la base de données.
# ⚠️ Pour un vrai projet en production, on utiliserait un outil comme
# Sealed Secrets ou un coffre-fort externe (Vault, AWS Secrets Manager).
# Ici, en base64 simple, c'est suffisant pour un lab d'apprentissage.
#
# Pour générer les valeurs toi-même :
#   echo -n "postgres" | base64        -> DB_USER
#   echo -n "change-me-please" | base64 -> DB_PASSWORD
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
data:
  DB_USER: cG9zdGdyZXM=          # postgres
  DB_PASSWORD: Y2hhbmdlLW1lLXBsZWFzZQ==  # change-me-please
